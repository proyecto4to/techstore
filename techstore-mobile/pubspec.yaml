name: techstore_mobile
description: Cliente Android oficial del sistema TechStore.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Verificación SHA-256 del APK descargado antes de instalarlo.
  crypto: ^3.0.6
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  dio: ^5.11.0
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: 10.0.0
  drift: ^2.34.3
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  stomp_dart_client: ^3.0.1
  uuid: ^4.6.0
  intl: ^0.20.3
  path: ^1.9.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  local_auth: ^3.0.2
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  printing: ^5.15.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  in_app_update: 5.0.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0
  # Mapa OpenStreetMap: la ubicación de la empresa y cada dirección de entrega.
  # Sin servicios pagos. flutter_map dibuja los tiles, latlong2 aporta el tipo
  # de coordenada y geolocator lee dónde está el teléfono. El buscador de
  # calles y el texto de la dirección salen de Nominatim, el servicio del
  # propio OpenStreetMap, con el mismo dio que el resto de la app.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  # Fotos de producto guardadas en disco: sin esto el catálogo entero volvía a
  # bajar por el túnel cada vez que se abría la app.
  cached_network_image: ^4.0.4
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  local_auth_platform_interface: ^1.1.0

# Los PNG de assets/branding no se editan a mano: salen de
# docs/marca/generador/generar-marca.mjs, que ya los deja con el margen que
# pide cada máscara. Por eso el inset va en cero.
flutter_launcher_icons:
  android: true
  image_path_android: assets/branding/icono_app.png
  min_sdk_android: 24
  adaptive_icon_background: assets/branding/icono_app_fondo.png
  adaptive_icon_foreground: assets/branding/icono_app_frente.png
  adaptive_icon_foreground_inset: 0
  # Android 13 tiñe este con los colores del fondo de pantalla si la persona
  # activó los íconos temáticos.
  adaptive_icon_monochrome: assets/branding/icono_app_mono.png

# La misma imagen en todas las versiones: así el isotipo aparece del mismo
# tamaño y en el mismo lugar en cualquier teléfono, y la pantalla /splash de
# Flutter lo puede continuar sin salto.
flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#000000"
  image: assets/branding/splash_isotipo.png
  android_gravity: center
  fullscreen: false
  android_12:
    color: "#000000"
    image: assets/branding/splash_isotipo.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Las licencias van en la app: la OFL pide distribuirlas con la fuente.
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  # Inter para leer, Space Grotesk para titular y para los precios, JetBrains
  # Mono para los rótulos «de código». Inter y Space Grotesk traen el signo ₲;
  # JetBrains Mono no, así que nunca se usa para importes.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
