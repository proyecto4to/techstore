<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TechStore">
  <title>TechStore</title>
  <defs>
    <linearGradient id="ts-marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F66E6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- El cuadrado aporta su propio fondo: el isotipo se lee igual sobre la web
       oscura que sobre el papel blanco de la factura. -->
  <rect width="64" height="64" rx="15" fill="url(#ts-marca)"/>
  <!-- Rayo: el trazo baja quebrado y vuelve a subir, como el ícono del navbar. -->
  <path d="M35.5 7 L17.5 34.5 H28.5 L25.5 57 L46.5 28.5 H34.5 Z"
        fill="#FFFFFF"/>
</svg>
