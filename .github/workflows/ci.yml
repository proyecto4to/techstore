name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  security:
    name: Repositorio (secretos + supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar secretos, credenciales, puertos y actions
        run: node scripts/ci-security-check.mjs

  codeql:
    name: SAST (${{ matrix.language }})
    if: github.event.repository.visibility == 'public' || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analizar
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  backend:
    name: Backend (Java 21 + verify)
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: techstore-backend
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y ejecutar unitarias e integración
        run: mvn -B clean verify
      - name: Generar SBOM CycloneDX
        run: >-
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom
          -DskipTests
          -DoutputFormat=json
          -DoutputName=backend.cdx
      - name: Revisar licencias declaradas
        run: node ../scripts/review-sbom-licenses.mjs target/backend.cdx.json
      - name: Inspeccionar JAR
        run: node ../scripts/ci-security-check.mjs --archive target/techstore-backend-1.0.0.jar
      - name: Conservar SBOM backend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-backend
          path: techstore-backend/target/backend.cdx.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend web (lint + tests + build)
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: techstore-frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: techstore-frontend/package-lock.json
          package-manager-cache: true
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Ejecutar lint, tests y build
        run: npm run check
        env:
          VITE_SHOW_DEMO_CREDENTIALS: "false"
      - name: Bloquear vulnerabilidades críticas de producción
        run: npm audit --omit=dev --audit-level=critical
      - name: Generar y revisar SBOM CycloneDX
        run: |
          mkdir -p ../artifacts
          npm sbom --sbom-format cyclonedx > ../artifacts/frontend.cdx.json
          node ../scripts/review-sbom-licenses.mjs ../artifacts/frontend.cdx.json
      - name: Inspeccionar bundle web
        run: node ../scripts/ci-security-check.mjs --artifact dist
      - name: Conservar SBOM frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-frontend
          path: artifacts/frontend.cdx.json
          if-no-files-found: error
          retention-days: 14
