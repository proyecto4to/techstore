name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  security:
    name: Repositorio (secretos + supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar secretos, credenciales, puertos y actions
        run: node scripts/ci-security-check.mjs
      - name: Validar contrato OpenAPI compartido
        run: node scripts/validate-openapi.mjs

  codeql:
    name: SAST (${{ matrix.language }})
    if: github.event.repository.visibility == 'public' || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analizar
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  backend:
    name: Backend (Java 21 + verify)
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: techstore-backend
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y ejecutar unitarias e integración
        run: mvn -B clean verify
      - name: Generar SBOM CycloneDX
        run: >-
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom
          -DskipTests
          -DoutputFormat=json
          -DoutputName=backend.cdx
      - name: Revisar licencias declaradas
        run: node ../scripts/review-sbom-licenses.mjs target/backend.cdx.json
      - name: Inspeccionar JAR
        run: node ../scripts/ci-security-check.mjs --archive target/techstore-backend-1.0.0.jar
      - name: Conservar SBOM backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-backend
          path: techstore-backend/target/backend.cdx.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend web (lint + tests + build)
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: techstore-frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: techstore-frontend/package-lock.json
          package-manager-cache: true
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Ejecutar lint, tests y build
        run: npm run check
        env:
          VITE_SHOW_DEMO_CREDENTIALS: "false"
      - name: Bloquear vulnerabilidades críticas de producción
        run: npm audit --omit=dev --audit-level=critical
      - name: Generar y revisar SBOM CycloneDX
        run: |
          mkdir -p ../artifacts
          npm sbom --sbom-format cyclonedx > ../artifacts/frontend.cdx.json
          node ../scripts/review-sbom-licenses.mjs ../artifacts/frontend.cdx.json
      - name: Inspeccionar bundle web
        run: node ../scripts/ci-security-check.mjs --artifact dist
      - name: Conservar SBOM frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-frontend
          path: artifacts/frontend.cdx.json
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Mobile Flutter (format + analyze + tests + APK debug)
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: techstore-mobile
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar Flutter 3.47.1
        working-directory: .
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolver dependencias
        run: flutter pub get
      - name: Verificar formato, análisis y tests
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
      - name: Compilar APK development
        run: flutter build apk --debug --flavor development -t lib/main_development.dart
