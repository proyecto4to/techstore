version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techstore-postgres
    environment:
      POSTGRES_DB: techstore_db
      POSTGRES_USER: techstore_user
      POSTGRES_PASSWORD: techstore_pass_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_ES.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstore_user -d techstore_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techstore-network

  backend:
    build:
      context: ./techstore-backend
      dockerfile: Dockerfile
    container_name: techstore-backend
    environment:
      SPRING_APPLICATION_NAME: techstore-api
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techstore_db
      SPRING_DATASOURCE_USERNAME: techstore_user
      SPRING_DATASOURCE_PASSWORD: techstore_pass_dev
      JWT_SECRET: "your-secret-key-change-in-production-min-32-chars-here!"
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_TECHSTORE: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - techstore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./techstore-frontend
      dockerfile: Dockerfile.dev
    container_name: techstore-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./techstore-frontend/src:/app/src
      - ./techstore-frontend/public:/app/public
      - /app/node_modules
    networks:
      - techstore-network
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  techstore-network:
    driver: bridge
