spring.application.name=TechStore API
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.context-path=/

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techstore_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:techstore_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:techstore_pass_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Asuncion

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.techstore=${LOGGING_LEVEL_COM_TECHSTORE:DEBUG}

jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-min-32-chars-here!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.max-age=${CORS_MAX_AGE:3600}

springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

empresa.nombre=TechStore Paraguay
empresa.ruc=${EMPRESA_RUC:80012345-6}
empresa.direccion=${EMPRESA_DIRECCION:Avda. Espa\u00f1a 1234 c/ Brasil}
empresa.ciudad=${EMPRESA_CIUDAD:Asunci\u00f3n, Paraguay}
empresa.telefono=${EMPRESA_TELEFONO:(021) 555-123}
empresa.actividad=${EMPRESA_ACTIVIDAD:Venta de equipos e insumos inform\u00e1ticos}
empresa.timbrado=${EMPRESA_TIMBRADO:12345678}
empresa.timbrado-vigencia=${EMPRESA_TIMBRADO_VIGENCIA:01/01/2026 al 31/12/2026}
app.version=1.0.0
