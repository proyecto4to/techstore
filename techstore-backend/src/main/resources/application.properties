spring.application.name=TechStore API
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8090}
server.servlet.context-path=/

# Textos que lee el usuario. El idioma sale del Accept-Language de la peticion;
# si no pide ninguno, o pide uno que no tenemos, cae al espanol, que es el
# idioma base (messages.properties, el que no lleva sufijo).
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=es
spring.web.locale-resolver=accept-header

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techstore_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:techstore_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:techstore_pass_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
# Tolera hasta 60s de espera si la base todavia esta arrancando/recuperandose,
# en vez de morir al primer intento fallido de conexion.
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Flyway usa su propia conexion, con el rol administrador.
# La aplicacion puede correr con un rol limitado (techstore_app: solo datos, sin
# DDL y sin poder saltearse Row Level Security), pero migrar necesita crear y
# alterar tablas. Si no se definen estas variables, Flyway usa las mismas
# credenciales que la aplicacion, que es como venia funcionando.
spring.flyway.url=${FLYWAY_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techstore_db}}
spring.flyway.user=${FLYWAY_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:techstore_user}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Asuncion

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.techstore=${LOGGING_LEVEL_COM_TECHSTORE:DEBUG}

jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-min-32-chars-here!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.max-age=${CORS_MAX_AGE:3600}

springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Antes de exponer esto fuera de esta PC, poner SPRINGDOC_ENABLED=false
# (o proteger el path en SecurityConfig): revela la forma de la API a
# quien llegue al puerto, sin login.
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
# El health no debe sondear el SMTP: sin credenciales daria DOWN y rompe el chequeo
# de arranque del launcher. El correo funciona igual cuando se configura.
management.health.mail.enabled=false

empresa.nombre=TechStore Paraguay
empresa.ruc=${EMPRESA_RUC:80012345-6}
empresa.direccion=${EMPRESA_DIRECCION:Avda. Espa\u00f1a 1234 c/ Brasil}
empresa.ciudad=${EMPRESA_CIUDAD:Asunci\u00f3n, Paraguay}
empresa.telefono=${EMPRESA_TELEFONO:(021) 555-123}
empresa.email=${EMPRESA_EMAIL:facturacion@techstore.py}
empresa.actividad=${EMPRESA_ACTIVIDAD:Venta de equipos e insumos inform\u00e1ticos}
empresa.timbrado=${EMPRESA_TIMBRADO:12345678}
empresa.timbrado-vigencia=${EMPRESA_TIMBRADO_VIGENCIA:01/01/2026 al 31/12/2026}

# Datos para el Documento Electronico del SIFEN (facturacion electronica, demostrativo)
empresa.tipo-contribuyente=${EMPRESA_TIPO_CONTRIBUYENTE:2}
empresa.establecimiento=${EMPRESA_ESTABLECIMIENTO:001}
empresa.punto-expedicion=${EMPRESA_PUNTO_EXPEDICION:001}
empresa.actividad-codigo=${EMPRESA_ACTIVIDAD_CODIGO:47411}
empresa.departamento-codigo=${EMPRESA_DEPARTAMENTO_CODIGO:11}
empresa.departamento-nombre=${EMPRESA_DEPARTAMENTO_NOMBRE:CENTRAL}
empresa.distrito-codigo=${EMPRESA_DISTRITO_CODIGO:1}
empresa.distrito-nombre=${EMPRESA_DISTRITO_NOMBRE:ASUNCION}
empresa.ciudad-codigo=${EMPRESA_CIUDAD_CODIGO:1}
empresa.ciudad-nombre=${EMPRESA_CIUDAD_NOMBRE:ASUNCION}
empresa.timbrado-inicio-vigencia=${EMPRESA_TIMBRADO_INICIO_VIGENCIA:2026-01-01}

# Registro de Comprobantes de la DNIT (RG 90/2021).
# Que numero se declara como identificacion del comprador en las ventas a
# consumidor final: el tipo 15 ("sin nombre") no exige el nombre pero si el
# numero. El valor lo define el contador de cada empresa; se edita en
# Admin -> Empresa.
empresa.identificacion-sin-nombre=${EMPRESA_IDENTIFICACION_SIN_NOMBRE:0}

# Factura electronica (SIFEN). Esta instalacion es DEMOSTRATIVA: arma el XML y
# el KuDE con el certificado autofirmado de prueba y NO transmite a la DNIT.
# El modo no puede quedar en OFF aca: la descarga del PDF de cualquier factura
# pasa por el generador del KuDE, asi que apagarlo deja sin facturas al sistema.
# Una instalacion comercial usa application-prod.properties, donde el default
# es OFF hasta que haya certificado y timbrado habilitados de verdad.
sifen.modo=${SIFEN_MODO:TEST}
sifen.version=150
# Declara a proposito que las credenciales y URLs de abajo son de prueba.
sifen.datos-demo=${SIFEN_DATOS_DEMO:true}
sifen.firma.ubicacion=${SIFEN_FIRMA_UBICACION:classpath:/sifen/techstore-fe-test.p12}
sifen.firma.password=${SIFEN_FIRMA_PASSWORD:changeit}
sifen.firma.alias=${SIFEN_FIRMA_ALIAS:techstore-fe}
# CSC de ejemplo del manual tecnico; no es un codigo habilitado.
sifen.qr.csc=${SIFEN_QR_CSC:ABCD0000000000000000000000000000}
sifen.qr.id-csc=${SIFEN_QR_ID_CSC:0001}
sifen.qr.base-url=${SIFEN_QR_BASE_URL:https://ekuatia.set.gov.py/consultas-test/qr}
sifen.qr.consulta-publica-url=${SIFEN_QR_CONSULTA_URL:https://ekuatia.set.gov.py/consultas-test/de}
sifen.endpoints.recepcion-sincrona=${SIFEN_WS_RECEPCION:https://sifen-test.set.gov.py/de/ws/sync/recibe.wsdl}
sifen.endpoints.recepcion-lote=${SIFEN_WS_RECEPCION_LOTE:https://sifen-test.set.gov.py/de/ws/async/recibe-lote.wsdl}
sifen.endpoints.consulta-lote=${SIFEN_WS_CONSULTA_LOTE:https://sifen-test.set.gov.py/de/ws/consultas/consulta-lote.wsdl}
sifen.endpoints.consulta-de=${SIFEN_WS_CONSULTA_DE:https://sifen-test.set.gov.py/de/ws/consultas/consulta.wsdl}
sifen.endpoints.consulta-ruc=${SIFEN_WS_CONSULTA_RUC:https://sifen-test.set.gov.py/de/ws/consultas/consulta-ruc.wsdl}
sifen.endpoints.eventos=${SIFEN_WS_EVENTOS:https://sifen-test.set.gov.py/de/ws/eventos/evento.wsdl}

# Notificaciones por correo (bandeja de salida en /correos).
# Envio REAL en cuanto se configuren credenciales SMTP (SPRING_MAIL_USERNAME/PASSWORD);
# si no, cada correo queda como "Simulado" (modo local, sin costo). Gmail por defecto.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.password-reset-url=${PASSWORD_RESET_URL:techstore://app/password/reset}
app.password-reset-minutes=${PASSWORD_RESET_MINUTES:15}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Punto de reposicion: cuanto colchon se quiere y que ventana de ventas se mira.
reposicion.dias-seguridad=${REPOSICION_DIAS_SEGURIDAD:7}
reposicion.dias-historial-ventas=${REPOSICION_DIAS_HISTORIAL:90}
reposicion.dias-entrega-por-defecto=${REPOSICION_DIAS_ENTREGA:15}

app.version=1.0.0
# Compatibilidad Mobile. Google Play firma, entrega y verifica el artefacto;
# el backend solo decide si una versión sigue siendo compatible.
app.mobile-update.minimum-version-code=${MOBILE_MIN_VERSION_CODE:1}
app.mobile-update.latest-version-code=${MOBILE_LATEST_VERSION_CODE:1}
app.mobile-update.play-store-url=${MOBILE_PLAY_STORE_URL:https://play.google.com/store/apps/details?id=py.com.techstore.app}
# Solo lo usa el primer arranque de una instalación comercial si la cuenta
# semilla todavía conserva admin123. En local queda vacío y no interviene.
app.bootstrap-admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
# Clave Base64 de 32 bytes para secretos guardados (SMTP). En dev puede quedar
# vacía; prod la exige y migra automáticamente cualquier contraseña heredada.
app.secrets.encryption-key=${APP_DATA_ENCRYPTION_KEY:}
# Base para los botones de los correos (Ir a mi cuenta, Ver pedido, etc.)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Push móvil. En local permanece desactivado; para Expo usar PUSH_PROVIDER=expo.
# EXPO_ACCESS_TOKEN solo es necesario si se activa la seguridad reforzada del proyecto Expo.
push.provider=${PUSH_PROVIDER:none}
push.expo-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
push.access-token=${EXPO_ACCESS_TOKEN:}
# Con PUSH_PROVIDER=fcm, Firebase Admin usa Application Default Credentials.
# En servidores propios: GOOGLE_APPLICATION_CREDENTIALS apunta a un JSON externo al repo.

# Transactional Outbox para correo y push. El checkout solo persiste eventos;
# este worker los entrega con backoff exponencial y sin retener la transacción comercial.
notifications.outbox.enabled=${NOTIFICATION_OUTBOX_ENABLED:true}
notifications.outbox.poll-interval-ms=${NOTIFICATION_OUTBOX_POLL_INTERVAL_MS:5000}
notifications.outbox.initial-delay-ms=${NOTIFICATION_OUTBOX_INITIAL_DELAY_MS:10000}
notifications.outbox.batch-size=${NOTIFICATION_OUTBOX_BATCH_SIZE:20}
notifications.outbox.max-attempts=${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:5}
notifications.outbox.base-retry-seconds=${NOTIFICATION_OUTBOX_BASE_RETRY_SECONDS:30}
notifications.outbox.max-retry-seconds=${NOTIFICATION_OUTBOX_MAX_RETRY_SECONDS:21600}
notifications.outbox.stale-after-seconds=${NOTIFICATION_OUTBOX_STALE_AFTER_SECONDS:900}

# Eventos durables para invalidación y recuperación Web/Mobile.
sync.outbox.enabled=${SYNC_OUTBOX_ENABLED:true}
sync.outbox.poll-interval-ms=${SYNC_OUTBOX_POLL_INTERVAL_MS:750}
sync.outbox.initial-delay-ms=${SYNC_OUTBOX_INITIAL_DELAY_MS:3000}
sync.outbox.batch-size=${SYNC_OUTBOX_BATCH_SIZE:100}
sync.outbox.stale-after-seconds=${SYNC_OUTBOX_STALE_AFTER_SECONDS:60}

# Subida de fotos de producto: se guardan fuera de OneDrive/del repo, igual
# que pgdata y los backups, y se sirven en /uploads/** (ver WebConfig).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.uploads.dir=${APP_UPLOADS_DIR:${LOCALAPPDATA:.}/TechStore/uploads}
