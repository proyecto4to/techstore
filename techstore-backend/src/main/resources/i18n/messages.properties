# Textos que lee el usuario. Español: es el idioma base del sistema.
#
# Los archivos .properties de Java se leen como UTF-8 desde Java 9, así que
# los acentos y la ñ van tal cual, sin escapes \u.
#
# El formato es MessageFormat: los argumentos son {0}, {1}... y por eso una
# comilla simple literal se escribe duplicada ('') en las frases que llevan
# argumentos. Si no, MessageFormat la interpreta como escape y se come el resto.
#
# Las claves nombran el dominio y el problema, no la frase: cambiar la
# redacción no debería obligar a tocar el código.

