# User-facing text in English. Falls back to messages.properties (Spanish)
# for any key missing here.
#
# Note this is not a word-for-word translation of the Spanish: the Spanish
# copy uses Paraguayan voseo ("Cerrala", "Probá de nuevo") and that register
# has no English equivalent, so the English reads as plain neutral English.
# That is the point of having the text out of the code.

