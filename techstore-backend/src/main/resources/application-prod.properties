# Perfil fail-closed para instalaciones comerciales.
# Los datos fiscales de demostración del application.properties base se borran:
# deben cargarse desde Admin -> Empresa antes de poder facturar.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.url=${FLYWAY_DB_URL:${SPRING_DATASOURCE_URL}}
spring.flyway.user=${FLYWAY_DB_USERNAME}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.flyway.clean-disabled=true

jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-url=${APP_FRONTEND_URL}
app.bootstrap-admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.demo-data-policy=${APP_DEMO_DATA_POLICY:refuse}
app.secrets.encryption-key=${APP_DATA_ENCRYPTION_KEY}

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
management.endpoints.web.exposure.include=health,info
logging.level.root=INFO
logging.level.com.techstore=INFO
spring.jpa.show-sql=false
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# SIFEN: se heredan los valores de application.properties, que son los del
# ambiente de PRUEBA de la DNIT. El KuDE se sigue generando (es el PDF que el
# negocio imprime y adjunta al correo) pero sale con la leyenda de documento
# sin valor tributario. Para emitir de verdad hay que definir por entorno
# SIFEN_MODO=PROD, SIFEN_DATOS_DEMO=false, el certificado propio en
# SIFEN_FIRMA_* (fuera del artefacto: file:/run/secrets/...), el CSC real y los
# endpoints de produccion. SifenProperties rechaza el arranque si en PROD queda
# cualquier rastro de prueba.

empresa.nombre=${EMPRESA_NOMBRE:}
empresa.ruc=${EMPRESA_RUC:}
empresa.direccion=${EMPRESA_DIRECCION:}
empresa.ciudad=${EMPRESA_CIUDAD:}
empresa.telefono=${EMPRESA_TELEFONO:}
empresa.email=${EMPRESA_EMAIL:}
empresa.actividad=${EMPRESA_ACTIVIDAD:}
empresa.timbrado=${EMPRESA_TIMBRADO:}
empresa.timbrado-vigencia=${EMPRESA_TIMBRADO_VIGENCIA:}
empresa.tipo-contribuyente=${EMPRESA_TIPO_CONTRIBUYENTE:}
empresa.establecimiento=${EMPRESA_ESTABLECIMIENTO:}
empresa.punto-expedicion=${EMPRESA_PUNTO_EXPEDICION:}
empresa.actividad-codigo=${EMPRESA_ACTIVIDAD_CODIGO:}
empresa.departamento-codigo=${EMPRESA_DEPARTAMENTO_CODIGO:}
empresa.departamento-nombre=${EMPRESA_DEPARTAMENTO_NOMBRE:}
empresa.distrito-codigo=${EMPRESA_DISTRITO_CODIGO:}
empresa.distrito-nombre=${EMPRESA_DISTRITO_NOMBRE:}
empresa.ciudad-codigo=${EMPRESA_CIUDAD_CODIGO:}
empresa.ciudad-nombre=${EMPRESA_CIUDAD_NOMBRE:}
empresa.timbrado-inicio-vigencia=${EMPRESA_TIMBRADO_INICIO_VIGENCIA:}
empresa.identificacion-sin-nombre=${EMPRESA_IDENTIFICACION_SIN_NOMBRE:}
