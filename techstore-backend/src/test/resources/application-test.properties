# Perfil de las pruebas de integracion.
# La conexion NO se define aca: la inyecta BaseDatosDePrueba en caliente, porque
# el puerto del PostgreSQL embebido se conoce recien al levantarlo.

# Clave fija y larga: el test no puede depender de secrets.local.ps1, que es de
# la maquina y no esta en el repositorio.
jwt.secret=clave-solo-para-tests-suficientemente-larga-para-hmac-sha256!!
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Sin SMTP: ningun test tiene que mandar un correo de verdad. El host apunta a
# un puerto muerto para que, si algo intentara enviar, falle rapido y evidente
# en vez de quedarse esperando el timeout de Gmail.
spring.mail.host=localhost
spring.mail.port=1
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.connectiontimeout=200
spring.mail.properties.mail.smtp.timeout=200
spring.mail.properties.mail.smtp.writetimeout=200

# Subidas de archivos a una carpeta temporal, no a la del sistema real.
app.uploads.dir=${java.io.tmpdir}/techstore-test-uploads
app.frontend-url=http://localhost:5173
sync.outbox.enabled=false
notifications.outbox.enabled=false

# Emisor de prueba. El RUC 80012345-0 tiene el digito verificador correcto
# (el 80012345-6 que circula en los ejemplos lo tiene inventado).
empresa.nombre=TechStore Pruebas
empresa.ruc=80012345-0
empresa.timbrado=12345678
empresa.establecimiento=001
empresa.punto-expedicion=001

logging.level.org.hibernate.SQL=warn
logging.level.org.flywaydb=info
